exclude: ^(src/phrase_gym/static/|frontend/src/api.generated.ts|frontend/openapi.json|build/|dist/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 0.50.0
    hooks:
      - id: pyrefly-check
        language: system
        entry: uv run pyrefly check
        pass_filenames: false
  - repo: local
    hooks:
      - id: project-contracts
        name: Project types, module sizes, client formatting and generated contracts
        entry: uv run python scripts/checks.py project-pre
        language: system
        pass_filenames: false
        always_run: true
