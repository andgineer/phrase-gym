exclude: ^(src/phrase_gym/static/|frontend/src/api.generated.ts|frontend/openapi.json|build/|dist/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        exclude: ^tests/
        args:
          - --fix
          - --line-length=100
          - --target-version=py313
          - --select=PL,A001,ARG,B,BLE,C,COM,E,F,G,I,ISC,N,PIE,Q,RET,S,SIM,SLF,TID,TRY,UP,W
          - --ignore=B019,S101,G004,TRY003,TRY300,TRY301,TRY400
          # Development commands resolve trusted tools from the operator's PATH.
          - --per-file-ignores=scripts/**:S603,scripts/**:S607
      - id: ruff-check
        name: ruff check tests
        files: ^tests/
        args: [--fix, --line-length=100, --target-version=py313, '--select=E,F,I,UP,B,SIM']
      - id: ruff-format
        args: [--line-length=100, --target-version=py313]
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 0.50.0
    hooks:
      - id: pyrefly-check
        language: system
        entry: uv run pyrefly check
        pass_filenames: false
  - repo: local
    hooks:
      - id: uv-lock
        name: Dependency lock
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
      - id: module-sizes
        name: Production module sizes
        entry: uv run inv check-sizes
        language: system
        pass_filenames: false
        always_run: true
      - id: client-format
        name: Client formatting
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
        always_run: true
      - id: api-contract
        name: Generated API contract
        entry: uv run inv check-api
        language: system
        pass_filenames: false
        always_run: true
