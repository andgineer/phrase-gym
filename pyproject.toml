[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "phrase-gym"
dynamic = ["version"]
description = "A small local trainer for bringing useful phrases into speech."
readme = "README.md"
authors = [{name = "Andrey Sorokin", email = "andrey@sorokin.engineer"}]
license = {file = "LICENSE"}
keywords = ["language-learning", "phrases", "spoken-retrieval"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.119.1",
  "pydantic==2.12.3",
  "platformdirs==4.5.0",
  "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
  "allure-pytest==2.14.2",
  "ghp-import==2.1.0",
  "httpx==0.28.1",
  "invoke==2.2.0",
  "mkdocs-awesome-pages-plugin==2.10.1",
  "mkdocstrings[python]==1.0.8",
  "mypy==1.18.2",
  "pre-commit==4.2.0",
  "pymdown-extensions==10.21.2",
  "pyrefly==0.50.0",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.2",
  "tomli-w==1.2.0",
  "zensical==0.0.41",
]

[project.scripts]
phrase-gym = "phrase_gym.main:main"

[project.urls]
Homepage = "https://andgineer.github.io/phrase-gym/"
Documentation = "https://andgineer.github.io/phrase-gym/"
Repository = "https://github.com/andgineer/phrase-gym"

[tool.hatch.version]
path = "src/phrase_gym/__about__.py"

[tool.hatch.build]
artifacts = ["src/phrase_gym/static/**"]

[tool.pyrefly]
project-includes = ["src"]
search-path = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "PL", "A001", "ARG", "B", "BLE", "C", "COM", "E", "F", "G", "I", "ISC",
  "N", "PIE", "Q", "RET", "S", "SIM", "SLF", "TID", "TRY", "UP", "W",
]
ignore = ["B019", "S101", "G004", "TRY003", "TRY300", "TRY301", "TRY400"]

[tool.ruff.lint.per-file-ignores]
# Tests retain the existing checks; scaffold production-only rules do not constrain fixtures.
"tests/**" = ["PL", "A001", "ARG", "BLE", "C", "COM", "G", "ISC", "N", "PIE", "Q", "RET", "S", "SLF", "TID", "TRY", "W"]
# Development commands deliberately resolve trusted tools from the operator's PATH.
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["phrase_gym"]
