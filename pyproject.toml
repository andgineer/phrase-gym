[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "phrase-gym"
dynamic = ["version"]
description = "A small local trainer for bringing useful phrases into speech."
readme = "README.md"
authors = [{name = "Andrey Sorokin", email = "andrey@sorokin.engineer"}]
license = {file = "LICENSE"}
keywords = ["language-learning", "phrases", "spoken-retrieval"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.119.1",
  "pydantic==2.12.3",
  "platformdirs==4.5.0",
  "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
  "allure-pytest==2.14.2",
  "ghp-import==2.1.0",
  "httpx==0.28.1",
  "invoke==2.2.0",
  "mkdocs-awesome-pages-plugin==2.10.1",
  "mkdocstrings[python]==1.0.8",
  "pre-commit==4.2.0",
  "pymdown-extensions==10.21.2",
  "pyrefly==0.50.0",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "tomli-w==1.2.0",
  "zensical==0.0.41",
]

[project.scripts]
phrase-gym = "phrase_gym.main:main"

[project.urls]
Homepage = "https://andgineer.github.io/phrase-gym/"
Documentation = "https://andgineer.github.io/phrase-gym/"
Repository = "https://github.com/andgineer/phrase-gym"

[tool.hatch.version]
path = "src/phrase_gym/__about__.py"

[tool.hatch.build]
artifacts = ["src/phrase_gym/static/**"]

[tool.pyrefly]
project-includes = ["src"]
search-path = ["src"]
