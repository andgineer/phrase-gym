[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "phrase-gym"
dynamic = [ "version",]
description = "A language trainer for automatic use of words and phrases through guided recall, spaced repetition, and targeted dialogue drills."
keywords = [ "language-learning", "spaced-repetition", "phrase-recall", ]
classifiers = [ "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent",]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9,<4",
    "alembic>=1.14,<2",
    "click>=8.2.0",
    "edge-tts>=7,<8",
    "fastapi>=0.115,<1",
    "fsrs>=6,<7",
    "llmbroker>=1.6,<2",
    "mutagen>=1.47,<2",
    "piper-tts>=1.3,<2",
    "platformdirs>=4,<5",
    "pydantic>=2.10,<3",
    "rich-click>=1.8.8",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]
[[project.authors]]
name = "Andrey Sorokin"
email = "andrey@sorokin.engineer"

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://andgineer.github.io/phrase-gym/"
Documentation = "https://andgineer.github.io/phrase-gym/"

[tool.ruff]
line-length = 99

[tool.hatch.version]
path = "src/phrase_gym/__about__.py"

[dependency-groups]
dev = [
    "allure-pytest>=2.14.2",
    "invoke>=2.2.0",
    "tomli-w>=1.2.0",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "zensical>=0.0.41",
    "mkdocstrings[python]>=0.30.1,<1",
    "pre-commit>=4.2.0",
    "pymdown-extensions>=10.15,<11",
    "pyrefly>=0.50.0",
    "pytest-cov>=6.1.1",
    "pytest>=8.3.5",
    "httpx>=0.28,<1",
    "ruff==0.9.3",
]

[project.scripts]
phrase-gym = "phrase_gym.main:phrase_gym"

# build.sh prepares the client here; editable backend-only installs remain valid.
[tool.hatch.build]
artifacts = ["src/phrase_gym/static/**"]
