[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "phrase-gym"
version = "0.1.0"
description = "A small local trainer for bringing useful phrases into speech."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.119.1",
  "pydantic==2.12.3",
  "platformdirs==4.5.0",
  "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.2",
]

[project.scripts]
phrase-gym = "phrase_gym.main:main"

[tool.hatch.build]
artifacts = ["src/phrase_gym/static/**"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["phrase_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
