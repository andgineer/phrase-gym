site_name: Phrase Gym
site_url: https://andgineer.github.io/phrase-gym/
site_author: Andrey Sorokin
repo_name: andgineer/phrase-gym
repo_url: https://github.com/andgineer/phrase-gym
edit_uri: edit/main/docs/src/LANGUAGE/
docs_dir: src/LANGUAGE
site_dir: SITE_DIR
plugins:
  - awesome-pages
  - search:
      lang: LANGUAGE
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
markdown_extensions:
  - abbr
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: docs/includes
nav:
  - Overview: index.md
  - Installation: installation.md
  - Import phrases: importing-phrases.md
  - Private access: private-access.md
  - Backup and restore: backup-and-restore.md
  - API reference: reference.md
