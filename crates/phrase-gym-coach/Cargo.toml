[package]
name = "phrase-gym-coach"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "phrase-gym-coach"
path = "src/main.rs"
required-features = ["desktop"]

[features]
desktop = ["dep:egui", "dep:eframe", "dep:wgpu", "dep:rfd"]

[dependencies]
directories = { version = "6.0.0", default-features = false }
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"], optional = true }
keyring-core = { version = "1.0.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "time"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu_no_default_features"], optional = true }
rfd = { version = "0.17.2", default-features = false, optional = true }
# Only the native backends Coach supports; eframe's own wgpu feature would add Vulkan, GL and WebGPU.
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "metal", "std", "wgsl"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["process", "std"] }
signal-hook = { version = "0.4.5", default-features = false }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10.0.1", default-features = false, features = ["creation-flags", "job-object", "kill-on-drop", "tokio1"] }
windows = { version = "0.62.2", default-features = false, features = ["Win32_System_Threading"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.37.0", default-features = false }
tempfile.workspace = true

[lints]
workspace = true
