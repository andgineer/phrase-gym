
# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
#
name: CI

env:
  PRIMARY_PYTHON_VERSION: '3.13'
  PRIMARY_PLATFORM: 'ubuntu-latest'
  PYTEST_CMD: >-
    python -m pytest
    --junitxml=pytest.xml
    --cov-report=term-missing:skip-covered
    --cov=src
    tests/

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  pull-requests: write
  contents: write

jobs:
  # Test compatibility with the matrix of Python versions and platforms
  matrix-build:
    strategy:
      matrix:
        python-version: [3.12, 3.13]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}


    - name: Install uv environment
      uses: andgineer/uv-venv@v3

    - name: Install dependencies
      run: uv sync --frozen --all-extras

    - name: Test with pytest
      run: ${{ env.PYTEST_CMD }}

# Build with publishing Allure report, coverage report
  primary-build:
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ env.PRIMARY_PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PRIMARY_PYTHON_VERSION }}


    - name: Install uv environment
      uses: andgineer/uv-venv@v3

    - name: Install dependencies
      run: uv sync --frozen --all-extras

    - name: Test with pytest and Allure report
      run: "${{ env.PYTEST_CMD }} --alluredir=./allure-results"

    - name: Load Allure test report history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages-dir

    - name: Generate Allure test report
      uses: andgineer/allure-report@v3.6
      id: allure-report
      if: always()
      with:
        allure-results: allure-results
        website: gh-pages-dir
        reports-site-path: builds/tests

    - name: Publish Allure test report
      uses: peaceiris/actions-gh-pages@v3
      if: ${{ always() && (steps.allure-report.outcome == 'success') }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ${{ steps.allure-report.outputs.reports-site }}
        destination_dir: ${{ steps.allure-report.outputs.reports-site-path }}

    - name: Coverage comment
      id: coverage_comment
      if: always()
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 85
        MINIMUM_ORANGE: 70

    - name: Store Pull Request comment to be posted
      uses: actions/upload-artifact@v4
      if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
      with:
        name: python-coverage-comment-action
        path: python-coverage-comment-action.txt

    - name: Upload coverage data to coveralls.io
      if: always()
      continue-on-error: true
      uses: coverallsapp/github-action@v2

    - name: Upload Coverage to Codecov
      if: always()
      continue-on-error: true
      uses: codecov/codecov-action@v4.0.1
      with:
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}


  # Rust replacement checks run alongside the Python gate until the cutover.
  rust-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install the pinned Rust toolchain
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@v2
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
      working-directory: frontend
    - name: Format, Clippy, architecture, client formatting and generated contracts
      run: cargo xtask pre
    - name: Independent release server build
      run: cargo build --release --locked --package phrase-gym-server

  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v4
    - name: Install the pinned Rust toolchain
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@v2
    - run: cargo test --workspace --all-features --locked

  client-build:
    # Native WebKit MediaRecorder is unavailable in the Linux Playwright build.
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: andgineer/uv-venv@v3
    - run: uv sync --frozen
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
      working-directory: frontend
    - name: Check generated contracts
      run: |
        uv run phrase-gym export-schema frontend/openapi.json
        npm --prefix frontend run generate:types
        git diff --exit-code -- frontend/openapi.json frontend/src/api.generated.ts
    - run: npm run typecheck
      working-directory: frontend
    - run: npm test
      working-directory: frontend
    - run: npm run build
      working-directory: frontend
    - run: npx playwright install --with-deps chromium webkit
      working-directory: frontend
    - run: npm run test:browser
      working-directory: frontend
    - name: Retain failed browser traces
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: browser-test-results
        path: frontend/test-results/
        if-no-files-found: ignore
    - name: Build package with client
      run: ./build.sh
