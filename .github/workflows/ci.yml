name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install the pinned Rust toolchain
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@v2
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
      working-directory: frontend
    - name: Format, Clippy, architecture, client formatting and generated contracts
      run: cargo xtask pre
    - name: Independent release server build
      run: cargo build --release --locked --package phrase-gym-server

  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v4
    - name: Install the pinned Rust toolchain
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@v2
    - run: cargo test --workspace --all-features --locked

  # Coach desktop: GUI build, kittest UI tests, fake-process supervision with process-group and Job
  # Object cleanup and a packaged launch on Apple Silicon and Windows x64.
  coach-desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Install the pinned Rust toolchain
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@v2
    - name: Clippy with the desktop feature
      run: cargo clippy --package phrase-gym-coach --all-targets --all-features --locked -- -D warnings
    # Coach integration tests build the real Server offline across the process boundary.
    - name: Build Server for Coach integration tests
      run: cargo build --package phrase-gym-server --locked
    - name: Coach tests
      run: cargo test --package phrase-gym-coach --all-features --locked
    - name: Packaged launch smoke test
      run: cargo xtask coach-smoke
    - name: Retain smoke reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coach-smoke-${{ matrix.platform }}
        path: target/coach-smoke/**/*.json
        if-no-files-found: ignore

  client-build:
    # Native WebKit MediaRecorder is unavailable in the Linux Playwright build.
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
      working-directory: frontend
    - name: Install the pinned Rust toolchain
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@v2
    - run: npm run typecheck
      working-directory: frontend
    - run: npm test
      working-directory: frontend
    - run: npm run build
      working-directory: frontend
    - run: npx playwright install --with-deps chromium webkit
      working-directory: frontend
    - run: npm run test:browser
      working-directory: frontend
    - name: Retain failed browser traces
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: browser-test-results
        path: frontend/test-results/
        if-no-files-found: ignore
    - name: Build the client and release binaries
      run: cargo xtask app-build
