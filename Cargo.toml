[workspace]
resolver = "3"
members = [
    "crates/phrase-gym-contracts",
    "crates/phrase-gym-core",
    "crates/phrase-gym-server",
    "crates/phrase-gym-coach",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
phrase-gym-contracts = { path = "crates/phrase-gym-contracts" }
phrase-gym-core = { path = "crates/phrase-gym-core" }

anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
http-body = { version = "1.1.0", default-features = false }
http-body-util = { version = "0.1.5", default-features = false }
icu_casemap = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std", "float_roundtrip"] }
sha2 = { version = "0.11.1", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tokio = { version = "1.53.3", default-features = false, features = ["rt-multi-thread", "net", "signal", "sync"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi", "env-filter"] }
utoipa = { version = "6.0.0", default-features = false, features = ["macros", "uuid"] }
uuid = { version = "1.28.0", default-features = false, features = ["std", "serde"] }
yaml-rust2 = { version = "0.13.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
