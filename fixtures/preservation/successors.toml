# Successors for every legacy test responsibility.
#
# A legacy harness may be deleted only when each module it runs is "covered" by a Rust or client
# successor, or "superseded" by a tested replacement of intentionally changed behavior.
#   covered:    every successor already runs without Python: Rust tests, client tests and scenarios
#               declared for Rust. Citing the Rust scenario runner without naming scenarios relies on
#               every scenario.
#   pending:    successors are ported in the named migration stage; listed scenarios already pin the
#               behavior against Python and must pass against Rust before the module is deleted.
#   superseded: the cited decision replaces the behavior; the replacement is tested in the named stage.
# Successor references: "scenario:<name>" (fixtures/preservation/scenarios), "rust:<path>", "client:<path>".

[[module]]
path = "tests/unit/test_review_policy.py"
responsibility = "Ratings map to Again/Hard/Good with short steps disabled; elapsed time and lapses drive intervals."
